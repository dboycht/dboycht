name: Update Charts

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        id: checkout

      - name: Generate Activity Heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_heatmap.py

      - name: Generate Repo Stats Chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_repo_stats.py

      - name: Generate Star Chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_star_chart.py

      # always(): a chart step that dies on a transient API error must not skip
      # the commit. Whatever did generate still gets pushed, and the run is red
      # so the failure stays visible.
      - name: Commit & Push
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update charts $(date -u +%Y-%m-%d)"
            git push
          fi
