<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .title { font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .label { font-size: 11px; }
    .count { font-size: 11px; fill: #8b949e; }
  </style>
  <rect width="480" height="220" rx="8" fill="#0d1117"/>
  <text x="20" y="28" class="title">Language Distribution (31 repos)</text>

  <!-- Bar chart -->
  <g transform="translate(20, 44)">
    <!-- Python 12/31 = 38.7% -->
    <text x="0" y="12" class="label">Python</text>
    <rect x="110" y="1" width="290" height="14" rx="3" fill="#3572A5"/>
    <text x="406" y="12" class="count">12</text>

    <!-- TypeScript 4/31 = 12.9% -->
    <text x="0" y="30" class="label">TypeScript</text>
    <rect x="110" y="19" width="97" height="14" rx="3" fill="#3178c6"/>
    <text x="213" y="30" class="count">4</text>

    <!-- Other 4/31 = 12.9% -->
    <text x="0" y="48" class="label">Other</text>
    <rect x="110" y="37" width="97" height="14" rx="3" fill="#8b949e"/>
    <text x="213" y="48" class="count">4</text>

    <!-- HTML 3/31 = 9.7% -->
    <text x="0" y="66" class="label">HTML</text>
    <rect x="110" y="55" width="72" height="14" rx="3" fill="#e34c26"/>
    <text x="188" y="66" class="count">3</text>

    <!-- JavaScript 2/31 = 6.5% -->
    <text x="0" y="84" class="label">JavaScript</text>
    <rect x="110" y="73" width="48" height="14" rx="3" fill="#f1e05a"/>
    <text x="164" y="84" class="count">2</text>

    <!-- C# 2/31 = 6.5% -->
    <text x="0" y="102" class="label">C#</text>
    <rect x="110" y="91" width="48" height="14" rx="3" fill="#178600"/>
    <text x="164" y="102" class="count">2</text>

    <!-- Jupyter Notebook 1 -->
    <text x="0" y="120" class="label">Jupyter</text>
    <rect x="110" y="109" width="24" height="14" rx="3" fill="#DA5B0B"/>
    <text x="140" y="120" class="count">1</text>

    <!-- PowerShell 1 -->
    <text x="0" y="138" class="label">PowerShell</text>
    <rect x="110" y="127" width="24" height="14" rx="3" fill="#012456"/>
    <text x="140" y="138" class="count">1</text>

    <!-- Rust 1 -->
    <text x="0" y="156" class="label">Rust</text>
    <rect x="110" y="145" width="24" height="14" rx="3" fill="#dea584"/>
    <text x="140" y="156" class="count">1</text>

    <!-- CSS 1 -->
    <text x="0" y="174" class="label">CSS</text>
    <rect x="110" y="163" width="24" height="14" rx="3" fill="#563d7c"/>
    <text x="140" y="174" class="count">1</text>
  </g>
</svg>
