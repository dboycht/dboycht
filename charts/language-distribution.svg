<svg xmlns="http://www.w3.org/2000/svg" width="480" height="246" viewBox="0 0 480 246">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .title { font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .label { font-size: 11px; }
    .count { font-size: 11px; fill: #8b949e; }
  </style>
  <rect width="480" height="246" rx="8" fill="#0d1117"/>
  <text x="20" y="28" class="title">Language Distribution (35 repos)</text>

  <!-- Bar chart -->
  <g transform="translate(20, 44)">
    <!-- Python 13/35 = 37.1% -->
    <text x="0" y="12" class="label">Python</text>
    <rect x="110" y="1" width="290" height="14" rx="3" fill="#3572A5"/>
    <text x="406" y="12" class="count">13</text>
    <!-- Other 5/35 = 14.3% -->
    <text x="0" y="30" class="label">Other</text>
    <rect x="110" y="19" width="112" height="14" rx="3" fill="#8b949e"/>
    <text x="228" y="30" class="count">5</text>
    <!-- TypeScript 4/35 = 11.4% -->
    <text x="0" y="48" class="label">TypeScript</text>
    <rect x="110" y="37" width="89" height="14" rx="3" fill="#3178c6"/>
    <text x="205" y="48" class="count">4</text>
    <!-- HTML 3/35 = 8.6% -->
    <text x="0" y="66" class="label">HTML</text>
    <rect x="110" y="55" width="67" height="14" rx="3" fill="#e34c26"/>
    <text x="183" y="66" class="count">3</text>
    <!-- JavaScript 3/35 = 8.6% -->
    <text x="0" y="84" class="label">JavaScript</text>
    <rect x="110" y="73" width="67" height="14" rx="3" fill="#f1e05a"/>
    <text x="183" y="84" class="count">3</text>
    <!-- C# 2/35 = 5.7% -->
    <text x="0" y="102" class="label">C#</text>
    <rect x="110" y="91" width="45" height="14" rx="3" fill="#178600"/>
    <text x="161" y="102" class="count">2</text>
    <!-- CSS 1/35 = 2.9% -->
    <text x="0" y="120" class="label">CSS</text>
    <rect x="110" y="109" width="22" height="14" rx="3" fill="#563d7c"/>
    <text x="138" y="120" class="count">1</text>
    <!-- Jupyter 1/35 = 2.9% -->
    <text x="0" y="138" class="label">Jupyter</text>
    <rect x="110" y="127" width="22" height="14" rx="3" fill="#DA5B0B"/>
    <text x="138" y="138" class="count">1</text>
    <!-- PowerShell 1/35 = 2.9% -->
    <text x="0" y="156" class="label">PowerShell</text>
    <rect x="110" y="145" width="22" height="14" rx="3" fill="#012456"/>
    <text x="138" y="156" class="count">1</text>
    <!-- Rust 1/35 = 2.9% -->
    <text x="0" y="174" class="label">Rust</text>
    <rect x="110" y="163" width="22" height="14" rx="3" fill="#dea584"/>
    <text x="138" y="174" class="count">1</text>
    <!-- Vue 1/35 = 2.9% -->
    <text x="0" y="192" class="label">Vue</text>
    <rect x="110" y="181" width="22" height="14" rx="3" fill="#4FC08D"/>
    <text x="138" y="192" class="count">1</text>
  </g>
</svg>